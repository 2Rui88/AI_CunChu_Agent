server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME 验证（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS（308 保留 POST 方法与请求体，避免明文 POST 被 301 降级为 GET）
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # SSL 证书路径（Let's Encrypt / 自签名共用）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 强制后续请求走 HTTPS（一年有效期，含子域名）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文本类响应压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    client_max_body_size 12m;

    # 带内容哈希的构建产物：长缓存（CRA 的 /static/ 文件名含哈希，内容变即换名）
    location ^~ /static/ {
        root /app/front;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 级 add_header 会覆盖继承的 HSTS，此处补齐
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 前端静态资源
    location / {
        root /app/front;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent SSE 特殊处理
    location /api/agent/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # HTTP/1.1 长连接 + 清除 Connection 头，SSE 流式传输的标准姿势
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 文件下载（代理到 MinIO，走预签名 URL）
    # Host 用 $http_host（含端口原始值）：SigV4 签名按签名时的 Host 校验，改写会验签失败
    # 前缀必须用 /dl/ 而非 /files/：以斜杠结尾的 proxy location 会对"恰少一个尾部斜杠"
    # 的请求（如 SPA 路由 GET /files）自动 301 到 /files/，进而把页面刷新代理成
    # MinIO 根路径的匿名 ListBuckets（AccessDenied XML 页面）
    location /dl/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
    }
}
