server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME 验证（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS（308 保留 POST 方法与请求体，避免明文 POST 被 301 降级为 GET）
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # SSL 证书路径（Let's Encrypt / 自签名共用）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 强制后续请求走 HTTPS（一年有效期，含子域名）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    # 前端静态资源
    location / {
        root /app/front;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent SSE 特殊处理
    location /api/agent/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 文件下载（代理到 MinIO，走预签名 URL）
    # Host 用 $http_host（含端口原始值）：SigV4 签名按签名时的 Host 校验，改写会验签失败
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
    }
}
