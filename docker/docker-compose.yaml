services:
  mysql:
    image: mysql:8.0
    container_name: tc_mysql
    restart: unless-stopped
    # 服务端默认字符集设为 utf8mb4，保证中文文件名/描述正常存储
    # 默认时区设为 +08:00：TIMESTAMP 列内部按 UTC 存储、读取按会话时区转换，
    # 不设置时容器为 UTC，共享广场/文件列表的时间会比北京时间早 8 小时
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    ports:
      # 仅绑定本机回环供调试，不对公网暴露 root 端口
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yuncunchu
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      my_net:
        ipv4_address: 172.30.0.2

  redis:
    image: redis:7-alpine
    container_name: tc_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      my_net:
        ipv4_address: 172.30.0.3

  minio:
    # MinIO 社区版 2025 年停止自由分发（Docker Hub 仓库门禁、dl.min.io 下线），
    # 改用 Bitnami 遗留仓库镜像 —— 同一 MinIO 服务器二进制的封装。
    # 数据目录为 /bitnami/minio/data（非官方镜像的 /data），入口脚本自管启动参数。
    image: bitnamilegacy/minio:latest
    container_name: tc_minio
    restart: unless-stopped
    ports:
      # 控制台仅绑定本机回环，不对公网暴露（桶已私有化，管理面不需要对外）
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      # Bitnami 精简镜像不带 curl，用 bash 内置 TCP 探测 9000 端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      my_net:
        ipv4_address: 172.30.0.4

  nginx:
    build:
      # 上下文为项目根目录：Dockerfile 需要访问 frontend/ 做多阶段构建
      context: ..
      dockerfile: docker/nginx/Dockerfile
    container_name: tc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      my_net:
        ipv4_address: 172.30.0.5

  backend:
    build:
      context: ../backend
    container_name: tc_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: yuncunchu
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # AI 统一密钥（仅存于环境变量，不落库不下发前端）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 对外预签名下载 URL 使用的地址（留空则退化为 MinIO 内网直连端点，仅适合本机调试）
      PUBLIC_SERVER_IP: ${PUBLIC_SERVER_IP:-}
      PUBLIC_SERVER_PORT: ${PUBLIC_SERVER_PORT:-443}
      PUBLIC_SERVER_SSL: ${PUBLIC_SERVER_SSL:-true}
    volumes:
      - faiss_data:/data/faiss
      # 分片临时目录挂卷：容器重启后分片仍在，断点续传才真正可用
      - chunk_data:/data/chunks
    networks:
      my_net:
        ipv4_address: 172.30.0.6

networks:
  my_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  mysql_data:
  minio_data:
  faiss_data:
  chunk_data:
